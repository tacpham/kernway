[package]
name        = "kernway-openapi"
description = "Kernway OpenAPI 3.0 spec generation — annotate routes, serve /openapi.json"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Spec generation is pure data — it only needs serde. It does NOT depend on the
# HTTP server or kernway-core; wiring OpenAPI into a running server is done by
# the consumer (e.g. kernway-server), not by this crate.
serde      = { workspace = true }
serde_json = { workspace = true }
