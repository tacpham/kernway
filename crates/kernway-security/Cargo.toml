[package]
name        = "kernway-security"
description = "Kernway security — CSRF tokens, security headers, and an authorization context"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true

[dependencies]
kernway-core = { workspace = true } # Request/Response/Layer integration
kernway-log  = { workspace = true } # store-error warnings on the auth path

# `getrandom` is the one third-party primitive here, and a deliberate exception to
# KEP-0000 §1: a CSRF token must be unpredictable, and rolling our own CSPRNG is
# exactly the "solid" failure that principle guards against. getrandom is the
# OS RNG, small and audited — the responsible dependency, like mio for I/O.
getrandom = "0.2"

# The Redis-backed SessionStore (feature = "redis"). Off by default — the
# in-memory store needs nothing, and this pulls in the async RESP client.
kernway-redis = { workspace = true, optional = true }

# File-backed durability (feature = "persist"): the snapshot + append-log engine,
# for stores that stay in memory but survive a restart without a Redis server.
kernway-persist = { workspace = true, optional = true }

# JSON for JWT claims (feature = "jwt"). A JWT must be spec-correct JSON to
# interoperate, so this is the responsible dependency (KEP-0000 §1) rather than a
# hand-rolled JSON — the same call as getrandom for the CSPRNG.
serde      = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# RSA signature verification for RS256/JWKS (feature = "jwks"). ring is the audited
# crypto behind rustls (already in the tree via the HTTP client) — never hand-roll RSA.
ring = { version = "0.17", optional = true }

[features]
# Presence / heartbeat — who is online now (KEP-0004 sibling). Off by default:
# an app that does not need it compiles none of it.
presence = []
# A distributed SessionStore backed by Redis, for multi-instance deployments.
# With `presence`, also brings the Redis-backed presence tracker.
redis = ["dep:kernway-redis"]
# Local, durable-on-disk backends (bans / sessions / activity): fast in-memory
# reads, but a restart keeps the data. Single-node (no sharing across instances).
persist = ["dep:kernway-persist"]
# JSON Web Tokens (RFC 7519), HS256 — a standards-compliant, stateless bearer
# token alongside the stateful session token. Pulls in serde for the claims JSON.
jwt = ["dep:serde", "dep:serde_json"]
# BCrypt verify/generate ($2a/$2b/$2y), byte-compatible with jBCrypt / Spring
# BCryptPasswordEncoder — for interop with an existing bcrypt user store. No new
# deps (uses the getrandom already pulled in for CSRF).
bcrypt = []
# RS256 verification against a JWKS — accept tokens from an external issuer
# (Auth0/Keycloak/Google) using their published public keys. Adds ring (RSA verify).
jwks = ["jwt", "dep:ring"]

[dev-dependencies]
criterion = { workspace = true }
# Drives the async Redis integration test's futures to completion.
rt-core = { workspace = true }

# Weighs the cost of making SessionStore async (a boxed future per call) against
# the sync call and against the HMAC verify the auth path pays regardless —
# the measurement behind the KEP-0004 sync-vs-async-store decision.
[[bench]]
name    = "session_store"
harness = false

[[bench]]
name              = "presence"
harness           = false
required-features = ["presence"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
