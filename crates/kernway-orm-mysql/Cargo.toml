[package]
name = "kernway-orm-mysql"
description = "MySQL backend for kernway-orm-core — a self-written wire-protocol driver (no external client, no tokio)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernway-orm-core = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }

# Driver implementation (behind the `mysql` feature): a self-written async wire
# protocol on the Kernway reactor (rt-net). Outside help is limited to the hashes the
# auth plugins require and rustls for TLS.
sha1    = { version = "0.10", optional = true }
# SHA-256 for caching_sha2_password (MySQL 8's default auth plugin).
sha2    = { version = "0.11", optional = true }
# TLS (ssl-mode) — the shared async rustls stream, also used by the HTTP client.
kernway-tls = { workspace = true, optional = true }
# Shared driver plumbing: buffered plaintext/TLS stream, per-core pool,
# bounded prepared-statement cache.
kernway-wire = { workspace = true, optional = true }
rt-core = { path = "../rt-core", optional = true }
rt-net  = { path = "../rt-net", optional = true }

[features]
default = []
# Enable to compile the actual MySQL driver. Without it the crate still exports
# `MySqlDialect` for shared SQL generation.
mysql = ["sha1", "sha2", "kernway-tls", "kernway-wire", "rt-core", "rt-net"]

[dev-dependencies]
# Checksums for the large-value write tests.
md-5              = "0.11"
kernway-orm-macro = { workspace = true }
rt-core           = { path = "../rt-core" }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
