[package]
name        = "kernway"
description = "Kernway — Rust Web Framework (Spring-inspired)"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true

# Baseline — always compiled. A fresh `kernway` is a working web server: DI,
# routing, HTTP, JSON, HTML, and static files. Optional capabilities are opted
# into with a feature and pull in nothing when off. See docs/design/modules/kernway.md.
[dependencies]
kernway-core   = { workspace = true }
kernway-server = { workspace = true }   # KernwayApp, Router, Middleware (+ http, static, rt, di transitively)
kernway-web    = { workspace = true }   # Json, Html, Path, Query, ProblemDetail, Validated
kernway-validation = { workspace = true } # Validate trait, rules, #[derive(Validate)]
kernway-config = { workspace = true }   # Config, #[configuration] (KEP-0007)
kernway-log    = { workspace = true }   # info!/warn!/error! + per-module levels
di-core        = { workspace = true }
di-macro       = { workspace = true }

# Optional — off by default, code and compile cost only when the feature is on.
kernway-htmx     = { workspace = true, optional = true }   # Htmx, HtmxResponse, Swap
kernway-security = { workspace = true, optional = true }   # CSRF, headers, sessions, presence

# Capability features. The first of them: `htmx` is the model every later
# capability (orm, cache, openapi, a template engine) follows —
# `kernway = { version = "…", features = ["htmx"] }` and nothing more.
[features]
default = []
## Typed `HX-*` request extraction and response headers (htmx 2.0.x).
htmx = ["dep:kernway-htmx"]
## Also read application.yml (in addition to .properties) for configuration.
yaml = ["kernway-config/yaml"]
## Security: CSRF tokens, security headers, and sessions (KEP-0004).
security = ["dep:kernway-security"]
## Presence / heartbeat — who is online now, plus the live-activity middleware.
## Independent of `security`.
presence = ["dep:kernway-security", "kernway-security/presence", "kernway-server/presence"]
## Redis-backed stores — a shared session/ban/activity registry for a multi-instance
## deployment. Implies `security`. With `presence`, also the Redis presence tracker.
redis = ["security", "kernway-security/redis", "kernway-server/redis"]
## File-backed (local disk) durable stores — sessions/bans/activity survive a
## restart with no server (single-node). Implies `security`.
persist = ["security", "kernway-security/persist", "kernway-server/persist"]
## JSON Web Tokens (RFC 7519, HS256) + the BearerAuth middleware — stateless
## `Authorization: Bearer <jwt>` auth. Implies `security`.
jwt = ["security", "kernway-security/jwt", "kernway-server/jwt"]
## Dynamic response compression middleware (gzip/deflate/br, selective by
## content-type + size + Accept-Encoding).
compression = ["kernway-server/compression"]

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
