[package]
name        = "kernway-config"
description = "Kernway configuration — layered .properties, profiles, and env overrides, parsed ourselves"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true
rust-version.workspace = true

# No dependencies: a .properties file and env overrides are a few lines to parse
# (KEP-0007 / KEP-0000 §1) — config load is not a hot path and not a reason to pull
# in toml/serde/yaml.
[dependencies]
# YAML is the one format we do NOT hand-roll — its spec (anchors, aliases, implicit
# typing) is thousands of lines, the responsible-dependency case (KEP-0007). Behind
# a feature: off by default, the properties baseline stays dependency-free.
yaml-rust2 = { version = "0.10", optional = true }

# The `#[configuration]` derive (Spring's @ConfigurationProperties) lives in
# di-macro; re-exported here behind `derive` so apps bind typed config without
# knowing di-macro exists. Optional: the plain get/get_or API stays derive-free.
di-macro = { workspace = true, optional = true }

[features]
# Also read application.yml / application-{profile}.yml, flattened into the same
# dotted-key Config.
yaml = ["dep:yaml-rust2"]
# Re-export the `#[configuration]` derive from this crate (`kernway_config::configuration`).
derive = ["dep:di-macro"]

[dev-dependencies]
di-macro = { workspace = true } # exercises the #[configuration] derive

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
