[package]
name        = "kernway-sse"
description = "Kernway Server-Sent Events — SseEvent, SseStream response type"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernway-core = { workspace = true }
# For the pub/sub → SSE bridge (a live SSE fed by a message-bus subscription).
kernway-cache-core = { path = "../kernway-cache-core" }

[dev-dependencies]
rt-core = { path = "../rt-core" }

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
