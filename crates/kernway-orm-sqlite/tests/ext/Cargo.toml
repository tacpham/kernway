# A tiny SQLite extension in C (src/ext.c, against the official
# sqlite3ext.h), built by tests/extensions.rs to prove that
# SqliteConfig::extension loads native extensions on Linux, macOS and Windows.
#
# Its own workspace: an extension is a separate library, never part of the
# driver's build.
[package]
name    = "kernway-test-ext"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[build-dependencies]
cc = "1"

[workspace]
