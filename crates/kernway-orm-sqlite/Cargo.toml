[package]
name    = "kernway-orm-sqlite"
version.workspace = true
edition.workspace = true
description = "SQLite for the kernway ORM — the shared SQL layer (CRUD, query builder, joins, transactions, cursors, raw SQL) on an embedded SQLite, every call on a per-connection worker thread so the reactor never blocks"
license.workspace = true

[dependencies]
kernway-orm-core = { workspace = true }
kernway-orm-sql  = { workspace = true }
kernway-wire     = { workspace = true }
# SQLite compiled from source (bundled): the same engine version on Linux,
# macOS and Windows, no system library needed. FTS5 and JSON are built in.
rusqlite         = { version = "0.31", features = ["bundled", "backup", "blob", "column_decltype", "functions", "hooks", "serialize"] }
serde            = { workspace = true }
serde_json       = { workspace = true }

[dev-dependencies]
kernway-orm-macro = { workspace = true }
kernway-orm-sql   = { workspace = true, features = ["conformance"] }
rt-core           = { workspace = true }

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
