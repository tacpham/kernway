[package]
name    = "kernway-orm-sqlite"
version.workspace = true
edition.workspace = true
description = "SQLite for the kernway ORM — its own binding to the C API of a vendored SQLite 3.54.1 — the shared SQL layer (CRUD, query builder, joins, transactions, cursors, raw SQL) on an embedded SQLite, every call on a per-connection worker thread so the reactor never blocks"
license.workspace = true

[dependencies]
kernway-orm-core = { workspace = true }
kernway-orm-sql  = { workspace = true }
kernway-wire     = { workspace = true }
# The blocking pool, for CPU-only changeset work (invert / concat / decode).
rt-core          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }

[build-dependencies]
# Compiles the vendored SQLite amalgamation (sqlite/).
cc = "1"

[dev-dependencies]
kernway-orm-macro = { workspace = true }
kernway-orm-sql   = { workspace = true, features = ["conformance"] }
rt-core           = { workspace = true }

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
