[package]
name        = "kernway-http-client"
description = "Async outbound HTTP/1.1 client on the Kernway runtime — the client half, for calling other services (OAuth2, external APIs, JWKS)"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
# The Kernway async socket — same runtime as the server, no tokio.
rt-net = { workspace = true }
# TLS for https:// — rustls (ring provider) + Mozilla roots. rustls is a state
# machine we drive over the async socket ourselves (no tokio-rustls).
rustls       = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
# Drives the client futures to completion in integration tests.
rt-core = { workspace = true }

[lints]
workspace = true
