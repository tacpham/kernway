[package]
name        = "kernway-http-client"
description = "Async outbound HTTP/1.1 client on the Kernway runtime — the client half, for calling other services (OAuth2, external APIs, JWKS)"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
# The Kernway async socket + timer — same runtime as the server, no tokio. rt-core's
# `timeout` bounds connect/read so a hung server can't hang the request forever.
rt-net  = { workspace = true }
rt-core = { workspace = true }
# TLS for https:// — rustls (ring provider) + Mozilla roots. rustls is a state
# machine we drive over the async socket ourselves (no tokio-rustls).
rustls       = { workspace = true }
webpki-roots = { workspace = true }
# Shared compression layer — decode gzip/deflate/br responses (the server side of the
# same crate compresses).
kernway-compress = { workspace = true }
# Pure-async DNS (no getaddrinfo thread). getaddrinfo stays as a last-resort
# fallback behind the `getaddrinfo-fallback` feature (default on).
kernway-dns = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Benchmark-only: the response parser hyper/reqwest use, as the incumbent to measure
# our own response-head parsing against (KEP-0000 §2). Never a real dependency.
httparse  = "1"

[features]
default = ["getaddrinfo-fallback"]
# Keep the OS `getaddrinfo` (on the blocking pool) as a last-resort resolver for
# what the pure-async stub deliberately doesn't cover: search domains, mDNS
# (`.local`), and macOS / systemd-resolved split-DNS. On by default; disable for
# a strictly-async build that resolves only via UDP DNS + /etc/hosts.
getaddrinfo-fallback = []

[[bench]]
name    = "client"
harness = false

[lints]
workspace = true
