[package]
name        = "kernway-udp"
description = "Async UDP socket for the Kernway runtime — foundation for kernway-dns"
version.workspace  = true
edition.workspace  = true
license.workspace  = true

# TODO: kernway-dns will depend on this once AsyncUdpSocket is implemented.
# kernway-http-client will then use kernway-dns for non-blocking DNS resolution
# instead of rt_core::spawn_blocking + std::net::ToSocketAddrs.

[dependencies]
rt-core = { workspace = true }
mio     = { workspace = true }   # UDP socket + readiness source (same primitive rt-core uses)

# Windows reports a datagram longer than the buffer as an error (WSAEMSGSIZE);
# socket2 turns it into the truncated read Unix gives, sender included.
[target.'cfg(windows)'.dependencies]
socket2 = "0.6"

[lints]
workspace = true
