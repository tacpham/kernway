[package]
name = "kernway-orm-meilisearch"
description = "Meilisearch backend for kernway-orm-core — full-text search engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernway-orm-core    = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
thiserror           = { workspace = true }

# Async HTTP — Kernway's own client, same runtime as the server, no tokio, no ureq.
# Only compiled when the `meilisearch` feature is enabled.
kernway-http-client = { workspace = true, optional = true }
rt-core             = { workspace = true, optional = true }

[features]
default = []
# Enable to compile the actual async HTTP-based Meilisearch implementation.
# Without this feature, all types are available but every operation returns
# OrmError::Unsupported — useful for compile-time checks without a running server.
#
# In your app's Cargo.toml:
#   kernway-orm-meilisearch = { ..., features = ["meilisearch"] }
meilisearch = ["dep:kernway-http-client", "dep:rt-core"]

[dev-dependencies]
kernway-orm-macro = { workspace = true }
rt-core           = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
