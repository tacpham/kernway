[package]
name = "kernway-orm-meilisearch"
description = "Meilisearch backend for kernway-orm-core — full-text search engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernway-orm-core = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }

# Blocking HTTP client — pure-Rust, no tokio. Wrapped in rt_core::spawn_blocking,
# the same pattern kernway-orm-sqlite uses with rusqlite.
ureq    = { version = "2", features = ["json"], optional = true }
rt-core = { workspace = true, optional = true }

[features]
default = []
# Enable to compile the actual HTTP-based Meilisearch implementation.
# Without this feature all types are available but every operation returns
# OrmError::Unsupported — useful for compile-time checks without a running server.
#
# In your app's Cargo.toml:
#   kernway-orm-meilisearch = { ..., features = ["meilisearch"] }
meilisearch = ["dep:ureq", "dep:rt-core"]

[dev-dependencies]
kernway-orm-macro = { workspace = true }
rt-core           = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
