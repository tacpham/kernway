[package]
name        = "kernway-wire"
description = "Shared wire plumbing for Kernway database drivers — buffered plaintext/TLS stream, per-core connection pool, bounded prepared-statement cache; protocol framing stays in each driver"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
# The per-core async socket the drivers speak over, and TLS on top of it.
rt-net      = { workspace = true }
kernway-tls = { workspace = true }
# The blocking pool (`offload`: DNS and file reads off the shard).
rt-core     = { workspace = true }
# SCRAM (`scram` feature): the hash functions; HMAC / PBKDF2 / base64 are ours.
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.11", optional = true }

[features]
default = []
# The shared SCRAM-SHA-1 / SCRAM-SHA-256 client (PostgreSQL, MongoDB).
scram = ["sha1", "sha2"]

[lints]
workspace = true
