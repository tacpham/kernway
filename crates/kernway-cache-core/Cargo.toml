[package]
name        = "kernway-cache-core"
description = "Kernway cache spec — Cache<K,V> trait, TTL, eviction (sync)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }

[dev-dependencies]
# Only to drive async single-flight tests on a real executor; the crate itself
# stays runtime-agnostic.
rt-core = { path = "../rt-core" }

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
