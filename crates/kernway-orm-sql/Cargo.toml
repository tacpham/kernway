[package]
name        = "kernway-orm-sql"
description = "The SQL half of the kernway ORM written once: CRUD engine, query builder, repositories and transactions over a small per-database backend trait"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
kernway-orm-core = { workspace = true }
# The shared per-core connection pool.
kernway-wire     = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
# The conformance suite (feature `conformance`): its test entities and executor.
kernway-orm-macro = { workspace = true, optional = true }
rt-core           = { workspace = true, optional = true }

[features]
# The shared test suite every SQL backend must pass against a live database.
conformance = ["kernway-orm-macro", "rt-core"]

[dev-dependencies]
kernway-orm-macro = { workspace = true }
rt-core           = { workspace = true }
# The real dialects of every backend, for tests/sql_generation.rs (the
# driver crates' default features: dialects only, where they can).
kernway-orm-postgres = { workspace = true }
kernway-orm-mysql    = { workspace = true }
kernway-orm-mssql    = { workspace = true }
kernway-orm-sqlite   = { workspace = true }
kernway-orm-oracle   = { workspace = true }

[lints]
workspace = true
