[package]
name        = "di-core"
description = "Kernway DI runtime — AppContext, bean registry"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[dependencies]
# NOTE: di-core is intentionally standalone — it depends on NO other kernway
# crate. `kernway-core` is web-flavoured (Request/Response/middleware), so the
# DI container must not pull it in. Keep this section free of internal deps.
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "resolve"
harness = false
