[package]
name = "kernway-orm-postgres"
description = "PostgreSQL backend for kernway-orm-core (backed by tokio-postgres)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernway-orm-core = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }

# Optional — only compiled when the user enables this backend.
# Pin to a stable minor version; the API is stable since 0.7.
tokio-postgres    = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.12", optional = true }

[features]
default = []
# Enable to compile the actual PostgreSQL driver implementation.
# Without this feature the crate only exports PostgresDialect.
postgres = ["tokio-postgres", "deadpool-postgres"]

[dev-dependencies]
kernway-orm-macro = { workspace = true }
rt-core           = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
