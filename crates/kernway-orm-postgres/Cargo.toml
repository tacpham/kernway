[package]
name        = "kernway-orm-postgres"
description = "PostgreSQL for the kernway ORM — a self-written async protocol v3 driver on the Kernway reactor: TLS, SCRAM / MD5, prepared statements, pipelining, cursors, COPY, LISTEN / NOTIFY, on the shared SQL layer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kernway-orm-core = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }

# Driver implementation (behind the `postgres` feature): a self-written async
# wire protocol on the Kernway reactor (rt-net). Outside help is limited to the
# MD5 hash (md5 auth) and rustls for TLS; SCRAM is kernway-wire's shared client.
md5             = { package = "md-5", version = "0.11", optional = true }
kernway-tls     = { workspace = true, optional = true }
kernway-wire    = { workspace = true, optional = true, features = ["scram"] }
kernway-orm-sql = { workspace = true, optional = true }
rt-core         = { workspace = true, optional = true }
rt-net          = { workspace = true, optional = true }

[features]
default = []
# The driver. Without it the crate only exports PostgresDialect.
postgres = ["md5", "kernway-tls", "kernway-wire", "kernway-orm-sql", "rt-core", "rt-net"]

[dev-dependencies]
kernway-orm-macro = { workspace = true }
kernway-orm-sql   = { workspace = true, features = ["conformance"] }
rt-core           = { workspace = true }

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
