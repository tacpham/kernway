[package]
name        = "kernway-http"
description = "Kernway HTTP/1.1 parser + writer — pure std, no external deps"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
kernway-core = { workspace = true }
thiserror    = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name    = "codec"
harness = false

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
