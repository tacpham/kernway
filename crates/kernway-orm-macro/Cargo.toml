[package]
name        = "kernway-orm-macro"
description = "Kernway ORM proc-macros — #[entity], #[id], #[column]"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn         = { workspace = true }
quote       = { workspace = true }
proc-macro2 = { workspace = true }
# NOTE: no dep on kernway-orm-core. The macro only *emits* `::kernway_orm_core::`
# token paths inside quote!{}; that crate is resolved in the USER's crate, not
# here. (Same pattern as di-macro.) Adding it back would be a phantom dep.
