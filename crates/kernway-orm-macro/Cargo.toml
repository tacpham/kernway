[package]
name        = "kernway-orm-macro"
description = "Kernway ORM proc-macros — #[entity], #[id], #[column]"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn         = { workspace = true }
quote       = { workspace = true }
proc-macro2 = { workspace = true }
# NOTE: no dep on kernway-orm-core. The macro only *emits* `::kernway_orm_core::`
# token paths inside quote!{}; that crate is resolved in the USER's crate, not
# here. (Same pattern as di-macro.) Adding it back would be a phantom dep.

[dev-dependencies]
# The tests compile real entities and repositories against the runtime the
# emitted code names, and check the macro's compile errors.
kernway-orm-core   = { workspace = true }
kernway-orm-memory = { workspace = true }
rt-core            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
trybuild           = "1"

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
