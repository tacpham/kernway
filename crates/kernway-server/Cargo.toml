[package]
name        = "kernway-server"
description = "Kernway HTTP server — Router, KernwayApp builder"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
kernway-core   = { workspace = true }
kernway-http   = { workspace = true }
kernway-static = { workspace = true }
rt-net         = { workspace = true }
rt-core        = { workspace = true }
di-core        = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Benchmark-only: the radix-trie router axum uses, as the incumbent to measure
# our own router against (KEP-0000 §2, the per-core loop). Never a real dep.
matchit   = "0.8"

[[bench]]
name    = "routing"
harness = false

[[bench]]
name    = "pipeline"
harness = false

[[bench]]
name    = "vs_matchit"
harness = false

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
