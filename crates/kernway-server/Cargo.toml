[package]
name        = "kernway-server"
description = "Kernway HTTP server — Router, KernwayApp builder"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
kernway-core     = { workspace = true }
kernway-http     = { workspace = true }
kernway-static   = { workspace = true }
kernway-web      = { workspace = true }   # Path/Json/Query/Validated for typed args
kernway-validation = { workspace = true } # the Validate bound on Validated<T> extract
serde            = { workspace = true }    # the DeserializeOwned bound on Json/Query
kernway-log      = { workspace = true }   # access logs + startup warnings
kernway-config   = { workspace = true }   # auto-load config, bind + logging from it
kernway-security = { workspace = true }   # SecurityContext for #[require_role]
rt-net         = { workspace = true }
rt-core        = { workspace = true }
di-core        = { workspace = true }
thiserror      = { workspace = true }

[features]
# The ActivityTracking middleware (a live "who's on the site" view) needs the
# Activity store from kernway-security, which is itself behind that crate's
# `presence` feature. Off by default — tracking visitor id + bans needs none of it.
presence = ["kernway-security/presence"]
# Config-driven backend selection (`backends` module): pick memory / file / redis
# per store from `kernway.*.store`. These forward the kernway-security backends.
persist = ["kernway-security/persist"]
redis = ["kernway-security/redis"]

[dev-dependencies]
criterion = { workspace = true }
# Benchmark-only: the radix-trie router axum uses, as the incumbent to measure
# our own router against (KEP-0000 §2, the per-core loop). Never a real dep.
matchit   = "0.8"

[[bench]]
name    = "routing"
harness = false

[[bench]]
name    = "pipeline"
harness = false

[[bench]]
name    = "vs_matchit"
harness = false

# A large-file download load test that sweeps the streaming chunk size, to set
# FILE_CHUNK from a measurement rather than a guess (KEP-0002). Not a criterion
# micro-bench — its own main; run with `cargo bench -p kernway-server --bench stream_chunk`.
[[bench]]
name    = "stream_chunk"
harness = false

[[bench]]
name    = "security"
harness = false

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
