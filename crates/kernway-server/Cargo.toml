[package]
name        = "kernway-server"
description = "Kernway HTTP server — Router, KernwayApp builder"
version.workspace    = true
edition.workspace    = true
license.workspace    = true

[dependencies]
kernway-core   = { workspace = true }
kernway-http   = { workspace = true }
kernway-static = { workspace = true }
kernway-log    = { workspace = true }   # access logs + startup warnings
rt-net         = { workspace = true }
rt-core        = { workspace = true }
di-core        = { workspace = true }
thiserror      = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Benchmark-only: the radix-trie router axum uses, as the incumbent to measure
# our own router against (KEP-0000 §2, the per-core loop). Never a real dep.
matchit   = "0.8"

[[bench]]
name    = "routing"
harness = false

[[bench]]
name    = "pipeline"
harness = false

[[bench]]
name    = "vs_matchit"
harness = false

# A large-file download load test that sweeps the streaming chunk size, to set
# FILE_CHUNK from a measurement rather than a guess (KEP-0002). Not a criterion
# micro-bench — its own main; run with `cargo bench -p kernway-server --bench stream_chunk`.
[[bench]]
name    = "stream_chunk"
harness = false

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
