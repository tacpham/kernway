[package]
name        = "di-macro"
description = "Kernway DI proc-macros — #[component], #[inject], #[controller], #[route]"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

# Required for a proc-macro crate
[lib]
proc-macro = true

[dependencies]
syn       = { workspace = true, features = ["full", "extra-traits", "derive"] }
quote     = { workspace = true }
proc-macro2 = { workspace = true }

# Integration tests exercise the generated code against the real DI runtime.
# (di-core does not depend on di-macro, so this introduces no cycle.)
[dev-dependencies]
di-core = { workspace = true }

[lints]
workspace = true

# docs.rs builds with every feature on, so feature-gated items still appear.
[package.metadata.docs.rs]
all-features = true
