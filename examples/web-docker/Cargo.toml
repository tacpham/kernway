[package]
name    = "web-docker"
version.workspace = true
edition.workspace = true

[[bin]]
name = "web-docker"
path = "src/main.rs"

# One dependency. The whole point of the meta-crate: a Kernway web app names
# `kernway` and nothing else. (M1a closed this — before it, KernwayApp was not
# reachable through `kernway`.)
[dependencies]
kernway = { path = "../../crates/kernway" }
