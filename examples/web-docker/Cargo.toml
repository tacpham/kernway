[package]
name    = "web-docker"
version.workspace = true
edition.workspace = true

[[bin]]
name = "web-docker"
path = "src/main.rs"

# One dependency. The whole point of the meta-crate: a Kernway web app names
# `kernway` and nothing else. (M1a closed this — before it, KernwayApp was not
# reachable through `kernway`.) The `htmx` feature adds the typed HX-* API used
# by the /htmx/greet route — one line, no extra crate named.
[dependencies]
kernway = { path = "../../crates/kernway", features = ["htmx"] }
