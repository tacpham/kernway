# Kernway demo configuration (KEP-0007).
# The committed defaults; a profile file or KW_ env vars override these.

server.port = 8080
server.host = 0.0.0.0

# Logging: a default level, plus per-module overrides — the loop KEP-0007 unlocks.
# Turn one module up (kernway_redis=debug) without touching the rest.
logging.level = info
logging.level.kernway_redis = debug
logging.level.kernway_security = warn
