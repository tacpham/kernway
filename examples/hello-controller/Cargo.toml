[package]
name    = "hello-controller"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
# The #[controller] macro expands to ::kernway_server:: paths, so a controller
# crate needs just kernway-server (+ the macros, + security for the auth middleware).
kernway-server     = { workspace = true }
kernway-security   = { workspace = true }
kernway-validation = { workspace = true } # #[derive(Validate)] for a Validated<T> arg
di-macro           = { workspace = true }
serde              = { workspace = true }

[features]
# Demonstrates the live-activity middleware (who's on the site + where).
presence = ["kernway-server/presence"]

[lints]
workspace = true
