[package]
name    = "hello-validate"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
kernway    = { path = "../../crates/kernway" }
# #[derive(Validate)] expands to ::kernway_validation:: paths, so the crate must
# be a direct dependency (as serde's derive needs serde).
kernway-validation = { path = "../../crates/kernway-validation" }
serde      = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
