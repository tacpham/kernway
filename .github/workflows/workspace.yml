# Every crate's own tests, on every OS, on every push: the whole workspace
# builds clippy-clean (warnings are errors here) and `cargo test --workspace`
# passes on Linux, macOS and Windows. The tests that need a real service
# (Redis, Meilisearch) or the network are `#[ignore]`d for local runs; the
# `services` job starts those services and runs them, so none is left
# unexercised.
name: workspace

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features: code behind a feature (drivers, Redis backends,
      # Meilisearch, presence, …) is built, linted and tested too.
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Every crate's tests
        run: cargo test --workspace --all-features

  services:
    name: service-backed tests (Redis, Meilisearch, network)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: testmasterkey
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    env:
      KW_REDIS_ADDR: 127.0.0.1:6379
      KERNWAY_REDIS_ADDR: 127.0.0.1:6379
      MEILI_URL: http://127.0.0.1:7700
      MEILI_API_KEY: testmasterkey
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for Meilisearch
        shell: bash
        run: for _ in $(seq 1 30); do curl -fs http://127.0.0.1:7700/health && break; sleep 2; done
      - name: The ignored tests, with their services
        shell: bash
        run: |
          CRATES="-p kernway-redis -p kernway-security -p kernway-orm-meilisearch -p kernway-dns -p kernway-http-client"
          want=$(cargo test $CRATES --all-features --lib --tests -- --ignored --list 2>/dev/null | grep -c ': test$')
          cargo test $CRATES --all-features --lib --tests -- --ignored --test-threads=1 2>&1 | tee services.log
          ran=$(grep -E '^test result' services.log | awk '{p+=$4} END{print p}')
          echo "ignored tests: $want, passed: $ran"
          # Green must mean they all ran: a test compiled out or skipped is a failure.
          test "$ran" -eq "$want" && test "$want" -ge 30
