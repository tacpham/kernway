# Database drivers on every OS. kernway's drivers must build and work on
# Linux, macOS and Windows, fully async on kernway's own reactor — so each OS
# runs the runtime, the shared SQL layer and the MySQL driver's whole test
# suite against a real MySQL 8.0 of its own, over TCP, TLS and the OS's local
# channel (Unix socket file / Windows named pipe). The acceptance report
# (acceptance/run.sh) takes each job's result as evidence.
name: drivers

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  drivers:
    name: drivers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux: the official image, its socket directory shared with the runner.
      - name: Start MySQL container (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/mysqld && chmod 777 /tmp/mysqld
          docker run -d --name kw-mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=secret \
            -v /tmp/mysqld:/var/run/mysqld mysql:8.0
          # Wait for the final server: the image's first-run init uses a
          # temporary one (no network, no root password yet).
          for _ in $(seq 1 90); do
            docker exec kw-mysql mysql -uroot -psecret -h127.0.0.1 --protocol=TCP -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          echo "MYSQL_CONTAINER=kw-mysql" >> "$GITHUB_ENV"

      - name: Prepare MySQL
        shell: bash
        run: .github/scripts/mysql-ci.sh

      - name: Runtime, shared SQL layer, MySQL driver — all tests, live
        shell: bash
        run: >
          cargo test -p rt-core -p rt-net -p kernway-wire -p kernway-orm-sql -p kernway-orm-mysql
          --features kernway-orm-mysql/mysql -- --test-threads=1

      - name: The local-channel tests ran (not skipped)
        shell: bash
        run: >
          cargo test -p kernway-orm-mysql --features mysql --test connection local_socket_ -- --test-threads=1 --nocapture 2>&1
          | tee local.log; ! grep -qi "skip:" local.log; grep -q "3 passed" local.log

      - name: Oracle driver — builds; unit and protocol tests on this OS
        shell: bash
        run: cargo test -p kernway-orm-oracle --lib --test no_blocking -- --test-threads=1

      - name: SQL Server driver — builds; unit and protocol tests on this OS
        shell: bash
        run: cargo test -p kernway-orm-mssql --features mssql --lib --test no_blocking -- --test-threads=1

  # The Redis client on every OS against real servers. Linux and macOS run the
  # whole suite — single node (TCP + Unix socket), TLS with mutual TLS,
  # Sentinel with a real failover, Cluster with a live slot migration and a
  # failover — from local redis-server processes. Windows has no official
  # Redis: Memurai (the Redis-compatible server for Windows) serves the
  # connection and command suites over TCP.
  redis:
    name: redis (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Redis servers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server redis-sentinel >/dev/null
          sudo systemctl stop redis-server redis-sentinel 2>/dev/null || true
          redis-server --version
          .github/scripts/redis-local.sh "$RUNNER_TEMP/redis"

      - name: Redis servers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install redis >/dev/null
          redis-server --version
          .github/scripts/redis-local.sh "$RUNNER_TEMP/redis"

      - name: Memurai (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install memurai-developer -y --no-progress >/dev/null
          for _ in $(seq 1 30); do
            "/c/Program Files/Memurai/memurai-cli.exe" PING 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          "/c/Program Files/Memurai/memurai-cli.exe" INFO server | grep -i version
          "/c/Program Files/Memurai/memurai-cli.exe" ACL SETUSER kernway on '>kernway_pw' '~*' '&*' '+@all'
          for v in "KERNWAY_REDIS_URL=redis://127.0.0.1:6379" "KW_REDIS_ADDR=127.0.0.1:6379" "KERNWAY_REDIS_ADDR=127.0.0.1:6379" \
                   "KERNWAY_REDIS_USER=kernway" "KERNWAY_REDIS_PASS=kernway_pw"; do
            echo "$v" >> "$GITHUB_ENV"
          done

      - name: Redis client — all tests, live
        shell: bash
        run: cargo test -p kernway-redis -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee redis.log

      - name: Nothing was skipped
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # TLS, Sentinel and Cluster run on Linux and macOS; here the
            # connection and command suites must have run, none skipped.
            cargo test -p kernway-redis --test connection --test commands -- --test-threads=1 --nocapture 2>&1 | tee win.log
            ! grep -q "skip:" win.log
            grep -q "test result: ok. 12 passed" win.log  # connection (the Unix-socket test is not built here)
            grep -q "test result: ok. 8 passed" win.log
          else
            ! grep -q "skip:" redis.log
          fi

  # The PostgreSQL driver on every OS against a real server with every
  # authentication method and TLS (tests/support/pg-setup.sh): Linux runs
  # PostgreSQL 18 in Docker (its socket directory shared with the runner),
  # then again on 14, the oldest supported release; macOS a native Homebrew
  # server (TCP + Unix socket); Windows the runner's own PostgreSQL (TCP).
  postgres:
    name: postgres (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: PostgreSQL 18 (Linux, Docker)
        if: runner.os == 'Linux'
        shell: bash
        run: PG_SOCKET_DIR=/tmp/kwpg-sock crates/kernway-orm-postgres/tests/support/pg-setup.sh "$RUNNER_TEMP/pg" >> "$GITHUB_ENV"

      - name: PostgreSQL (macOS, Homebrew)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install postgresql@17 >/dev/null
          PG_BIN="$(brew --prefix postgresql@17)/bin" crates/kernway-orm-postgres/tests/support/pg-setup.sh "$RUNNER_TEMP/pg" >> "$GITHUB_ENV"

      - name: PostgreSQL (Windows, preinstalled)
        if: runner.os == 'Windows'
        shell: bash
        run: PG_BIN="$(cygpath -u "$PGBIN")" crates/kernway-orm-postgres/tests/support/pg-setup.sh "$RUNNER_TEMP/pg" >> "$GITHUB_ENV"

      - name: PostgreSQL driver — all tests, live
        shell: bash
        run: cargo test -p kernway-orm-postgres --features postgres -- --test-threads=1 --nocapture 2>&1 | tee pg.log; test "${PIPESTATUS[0]}" = 0

      - name: Nothing was skipped
        shell: bash
        run: |
          ! grep -q "skip:" pg.log
          grep -q "^test postgres_conforms" pg.log

      - name: Again on PostgreSQL 14 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          env="$(PG_IMAGE=postgres:14-alpine PG_PORT=5434 PG_CONTAINER=kernway-postgres-14 \
            crates/kernway-orm-postgres/tests/support/pg-setup.sh "$RUNNER_TEMP/pg14")"
          set -a; eval "$env"; set +a
          unset KERNWAY_PG_SOCKET_DIR
          cargo test -p kernway-orm-postgres --features postgres -- --test-threads=1 --skip unix_domain_socket --nocapture 2>&1 | tee pg14.log
          ! grep -q "skip:" pg14.log

  # The MongoDB driver on every OS against MongoDB 8.0: a standalone with
  # SCRAM users (and its Unix socket), a TLS-only server with X.509 users, a
  # three-member replica set and a sharded cluster with two routers
  # (tests/support/mongo-setup.sh). Linux runs them in Docker; macOS and
  # Windows run the official binaries natively.
  mongodb:
    name: mongodb (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MONGO_VERSION: 8.0.4
      MONGOSH_VERSION: 2.3.8
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: MongoDB (Linux, Docker)
        if: runner.os == 'Linux'
        shell: bash
        run: MONGO_SOCKET_DIR=/tmp/kwmongo-sock crates/kernway-orm-mongodb/tests/support/mongo-setup.sh "$RUNNER_TEMP/mongo" >> "$GITHUB_ENV"

      - name: MongoDB (macOS, official binaries)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL "https://fastdl.mongodb.org/osx/mongodb-macos-arm64-$MONGO_VERSION.tgz" | tar xz
          curl -fsSL -o mongosh.zip "https://downloads.mongodb.com/compass/mongosh-$MONGOSH_VERSION-darwin-arm64.zip" && unzip -q mongosh.zip
          cd "$GITHUB_WORKSPACE"
          MONGO_BIN="$RUNNER_TEMP/mongodb-macos-aarch64-$MONGO_VERSION/bin" MONGOSH="$RUNNER_TEMP/mongosh-$MONGOSH_VERSION-darwin-arm64/bin/mongosh" \
            crates/kernway-orm-mongodb/tests/support/mongo-setup.sh "$RUNNER_TEMP/mongo" >> "$GITHUB_ENV"

      - name: MongoDB (Windows, official binaries)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSL -o "$T/mongodb.zip" "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$MONGO_VERSION.zip" && unzip -q "$T/mongodb.zip" -d "$T"
          curl -fsSL -o "$T/mongosh.zip" "https://downloads.mongodb.com/compass/mongosh-$MONGOSH_VERSION-win32-x64.zip" && unzip -q "$T/mongosh.zip" -d "$T"
          MONGO_BIN="$(ls -d "$T"/mongodb-win32-x86_64-*/bin | head -1)" MONGOSH="$T/mongosh-$MONGOSH_VERSION-win32-x64/bin/mongosh.exe" \
            crates/kernway-orm-mongodb/tests/support/mongo-setup.sh "$T/mongo" >> "$GITHUB_ENV"

      - name: MongoDB driver — all tests, live
        shell: bash
        run: cargo test -p kernway-orm-mongodb -- --test-threads=1 --nocapture 2>&1 | tee mongo.log

      - name: Nothing was skipped
        shell: bash
        run: |
          ! grep -q "skip:" mongo.log
          grep -q "^test transactions_and_no_lost_update" mongo.log

  # NATS is one static binary on every OS: the setup script downloads the
  # official release and starts plain / auth / token / TLS / mTLS servers and
  # a three-node JetStream cluster natively — no Docker anywhere.
  nats:
    name: nats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: NATS servers (official release binary)
        shell: bash
        run: crates/kernway-nats/tests/support/nats-setup.sh "$RUNNER_TEMP/nats" >> "$GITHUB_ENV"

      - name: Messaging contract and NATS client — all tests, live
        shell: bash
        run: cargo test -p kernway-messaging --features conformance -p kernway-nats -- --test-threads=1 --nocapture 2>&1 | tee nats.log

      - name: Every scenario ran (nothing skipped or n/a)
        shell: bash
        # A failing test already failed the step above (pipefail); this one
        # checks the live tests were not skipped and the suites ran at all.
        # Names only: with --nocapture a test's output can share its line.
        run: |
          ! grep -q "skip:" nats.log
          # The one capability JetStream lacks (a GAP in the acceptance report).
          ! grep "^n/a" nats.log | grep -v "^n/a: key order across members$"
          for t in conformance::tests::the_memory_broker_conforms nats_jetstream_conforms \
                   the_cluster_runs_the_conformance_scenarios_too cluster_urls_are_learned_and_used_for_failover; do
            grep -q "^test $t " nats.log || { echo "did not run: $t"; exit 1; }
          done

  # RabbitMQ: Docker on Linux; on macOS (Homebrew) and Windows (Chocolatey)
  # the broker is installed natively and the setup script starts its own
  # node with the test config (TLS, EXTERNAL) — the Windows service is
  # stopped first.
  rabbitmq:
    name: rabbitmq (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: RabbitMQ (Linux, Docker)
        if: runner.os == 'Linux'
        shell: bash
        run: crates/kernway-rabbitmq/tests/support/rabbitmq-setup.sh "$RUNNER_TEMP/rabbitmq" >> "$GITHUB_ENV"

      - name: RabbitMQ (macOS, Homebrew)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install rabbitmq >/dev/null
          RABBITMQ_SBIN="$(brew --prefix rabbitmq)/sbin" crates/kernway-rabbitmq/tests/support/rabbitmq-setup.sh "$RUNNER_TEMP/rabbitmq" >> "$GITHUB_ENV"

      - name: RabbitMQ (Windows, Chocolatey)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Chocolatey once answered 0 having installed neither Erlang nor
          # RabbitMQ: keep its log, check the result, install once more.
          installed() {
            ERLANG_HOME=""
            # Where Chocolatey put Erlang (pipefail: no `ls` of a missing glob).
            for d in "/c/Program Files/Erlang OTP" "/c/Program Files"/erl*; do
              if [ -d "$d/bin" ]; then ERLANG_HOME="$d"; break; fi
            done
            [ -n "$ERLANG_HOME" ] && compgen -G "/c/Program Files/RabbitMQ Server/rabbitmq_server-*/sbin" >/dev/null
          }
          for attempt in 1 2; do
            choco install rabbitmq -y --no-progress ${force:-} > "$RUNNER_TEMP/choco.log" 2>&1 || true
            installed && break
            echo "Erlang / RabbitMQ missing after choco install (attempt $attempt):"; tail -40 "$RUNNER_TEMP/choco.log"
            [ "$attempt" = 2 ] && { ls "/c/Program Files"; exit 1; }
            force=--force
          done
          sc.exe stop RabbitMQ >/dev/null 2>&1 || true
          sleep 5
          # Short (8.3) names: cmd.exe, which runs the .bat scripts, splits
          # quoted paths with spaces (C:\Program Files) however they are quoted.
          export ERLANG_HOME="$(cygpath -d "$ERLANG_HOME")"
          echo "ERLANG_HOME=$ERLANG_HOME" >> "$GITHUB_ENV"
          for d in "/c/Program Files/RabbitMQ Server"/rabbitmq_server-*/sbin; do
            if [ -d "$d" ]; then SBIN="$d"; fi
          done
          [ -n "${SBIN:-}" ] || { echo "RabbitMQ not found"; ls "/c/Program Files"; exit 1; }
          SBIN="$(cygpath -u "$(cygpath -d "$SBIN")")"
          echo "Erlang: $ERLANG_HOME, RabbitMQ: $SBIN"
          RABBITMQ_SBIN="$SBIN" crates/kernway-rabbitmq/tests/support/rabbitmq-setup.sh "$(cygpath -u "$RUNNER_TEMP")/rabbitmq" >> "$GITHUB_ENV"

      - name: RabbitMQ client — all tests, live
        shell: bash
        run: cargo test -p kernway-rabbitmq -- --test-threads=1 --nocapture 2>&1 | tee rabbitmq.log

      - name: Every scenario ran (nothing skipped)
        shell: bash
        # A failing test already failed the step above (pipefail).
        run: |
          ! grep -q "skip:" rabbitmq.log
          # The two capabilities RabbitMQ lacks (GAPs in the acceptance report).
          ! grep "^n/a" rabbitmq.log | grep -v -e "^n/a: key order across members$" -e "^n/a: no replay for a new group (the latest half ran)$"
          for t in rabbitmq_conforms tls_mutual_tls_and_external_auth consumers_and_producers_survive_a_lost_connection memory_alarms_block_publishers; do
            grep -q "^test $t " rabbitmq.log || { echo "did not run: $t"; exit 1; }
          done

  # Meilisearch is one binary on every OS: the setup script downloads the
  # official release and runs it natively.
  meilisearch:
    name: meilisearch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Meilisearch (official release binary)
        shell: bash
        run: crates/kernway-orm-meilisearch/tests/support/meili-setup.sh "$RUNNER_TEMP/meili" >> "$GITHUB_ENV"

      - name: Meilisearch driver — all tests, live
        shell: bash
        run: cargo test -p kernway-orm-meilisearch --features meilisearch --lib --tests -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee meili.log

      - name: The live tests ran
        shell: bash
        run: |
          for t in test_ping test_vietnamese_search_ignores_diacritics test_errors_are_reported; do
            grep -q "^test $t " meili.log || { echo "did not run: $t"; exit 1; }
          done

  # Kafka: Docker on Linux, the official release natively on macOS (Java
  # from setup-java), configured by the same setup script. Windows runs the
  # client's build and its tests that need no broker: the broker cannot
  # delete a topic there (KAFKA-1194 — renaming the log dir is denied and it
  # shuts down; seen in this job's own log), and every scenario deletes its
  # topics.
  kafka:
    name: kafka (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      KAFKA_VERSION: 3.9.1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        if: runner.os == 'macOS'
        with:
          distribution: temurin
          java-version: "17"

      - name: Kafka (Linux, Docker)
        if: runner.os == 'Linux'
        shell: bash
        run: crates/kernway-kafka/tests/support/kafka-setup.sh "$RUNNER_TEMP/kafka" >> "$GITHUB_ENV"

      - name: Kafka (macOS, official release)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          T="$RUNNER_TEMP"
          curl -fsSL "https://archive.apache.org/dist/kafka/$KAFKA_VERSION/kafka_2.13-$KAFKA_VERSION.tgz" | tar xz -C "$T"
          KAFKA_HOME="$T/kafka_2.13-$KAFKA_VERSION" crates/kernway-kafka/tests/support/kafka-setup.sh "$T/kafka" >> "$GITHUB_ENV"

      - name: Kafka client — all tests, live
        if: runner.os != 'Windows'
        shell: bash
        run: cargo test -p kernway-kafka -- --test-threads=1 --nocapture 2>&1 | tee kafka.log

      - name: Kafka client — builds; tests without a broker (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test -p kernway-kafka --lib --test no_blocking -- --test-threads=1

      - name: Broker log (on failure)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          D="$KERNWAY_KAFKA_DIR"
          tail -40 "$D/server.out" 2>/dev/null || true
          grep -hE "ERROR|FATAL|Shutdown|failed" "$D"/logs/*.log 2>/dev/null | tail -40 || true

      - name: Every scenario ran (nothing skipped or n/a)
        if: runner.os != 'Windows'
        shell: bash
        # A failing test already failed the step above (pipefail).
        run: |
          ! grep -q "skip:" kafka.log
          ! grep -q "^n/a" kafka.log
          for t in kafka_conforms sasl_plain_and_scram tls_server_check_and_client_certificate reads_what_the_java_client_writes producers_and_consumers_survive_a_broker_restart; do
            grep -q "^test $t " kafka.log || { echo "did not run: $t"; exit 1; }
          done

  # MariaDB through the MySQL driver (Docker on Linux; the client itself is
  # the MySQL job's, tested there on every OS).
  mariadb:
    name: mariadb (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: MariaDB 11.4 (LTS)
        shell: bash
        run: crates/kernway-orm-mysql/tests/support/mariadb-setup.sh "$RUNNER_TEMP/mariadb" >> "$GITHUB_ENV"

      - name: MySQL driver — all tests against MariaDB, live
        shell: bash
        # caching_sha2_password is MySQL's; the local channel is the mysql job's.
        run: cargo test -p kernway-orm-mysql --features mysql --lib --tests -- --test-threads=1 --skip local_socket_ --skip caching_sha2 2>&1 | tee mariadb.log

      - name: Nothing was skipped
        shell: bash
        run: |
          ! grep -q "skip:" mariadb.log
          grep -q "^test mysql_conforms " mariadb.log

  # Valkey (the BSD fork of Redis 7.2) through the Redis client: the same
  # single / TLS / Sentinel / Cluster deployments as the acceptance run, on
  # the Valkey image in Docker. The Unix-socket test runs in the container
  # during the acceptance run.
  valkey:
    name: valkey (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      REDIS_IMAGE: valkey/valkey:8.1-alpine
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Valkey deployments (Docker)
        shell: bash
        run: |
          S=crates/kernway-redis/tests/support
          docker run -d --name kernway-valkey -p 6380:6379 "$REDIS_IMAGE" redis-server >/dev/null
          for _ in $(seq 1 30); do docker exec kernway-valkey redis-cli PING 2>/dev/null | grep -q PONG && break; sleep 1; done
          docker exec kernway-valkey redis-server --version
          docker exec kernway-valkey redis-cli ACL SETUSER kernway on '>kernway_pw' '~*' '&*' '+@all' >/dev/null
          "$S/redis-tls-setup.sh" "$RUNNER_TEMP/valkey-tls" >/dev/null
          "$S/redis-sentinel-setup.sh" >/dev/null
          "$S/redis-cluster-setup.sh" >/dev/null
          for v in KERNWAY_REDIS_URL=redis://127.0.0.1:6380 KW_REDIS_ADDR=127.0.0.1:6380 KERNWAY_REDIS_ADDR=127.0.0.1:6380 \
                   KERNWAY_REDIS_USER=kernway KERNWAY_REDIS_PASS=kernway_pw \
                   KERNWAY_REDIS_TLS_URL=rediss://localhost:6381 "KERNWAY_REDIS_TLS_DIR=$RUNNER_TEMP/valkey-tls" \
                   KERNWAY_REDIS_SENTINEL_URL=redis+sentinel://127.0.0.1:26390,127.0.0.1:26391,127.0.0.1:26392/kwmaster \
                   KERNWAY_REDIS_CLUSTER_URL=redis+cluster://127.0.0.1:7000,127.0.0.1:7001; do
            echo "$v" >> "$GITHUB_ENV"
          done

      - name: Redis client — all tests against Valkey, live
        shell: bash
        run: cargo test -p kernway-redis -- --include-ignored --test-threads=1 --nocapture --skip unix_socket_ 2>&1 | tee valkey.log

      - name: Nothing was skipped
        shell: bash
        run: |
          ! grep -q "skip:" valkey.log

  # S3-compatible object storage: the Versity S3 Gateway, one binary on every
  # OS, downloaded and run natively by the setup script.
  s3:
    name: s3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: S3 server (versitygw, official release)
        shell: bash
        run: crates/kernway-s3/tests/support/s3-setup.sh "$RUNNER_TEMP/s3" >> "$GITHUB_ENV"

      - name: S3 client — all tests, live
        shell: bash
        run: cargo test -p kernway-s3 -p kernway-http-client -- --test-threads=1 --nocapture 2>&1 | tee s3.log

      - name: Nothing was skipped
        shell: bash
        run: |
          ! grep -q "skip:" s3.log
          grep -q "^test presigned_urls_work_without_credentials " s3.log

  # SQL Server runs on Linux in Docker (Microsoft ships no macOS build, and a
  # Windows runner has no TCP-enabled instance); the client code is the same
  # on every OS — it builds and its unit tests pass in the drivers job above.
  mssql:
    name: mssql live (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: SQL Server 2022
        shell: bash
        run: crates/kernway-orm-mssql/tests/support/mssql-setup.sh "$RUNNER_TEMP/mssql" >> "$GITHUB_ENV"

      - name: SQL Server driver — all tests, live
        shell: bash
        run: cargo test -p kernway-orm-mssql --features mssql -- --test-threads=1 --nocapture 2>&1 | tee mssql.log

      - name: Nothing was skipped
        shell: bash
        run: |
          ! grep -q "skip:" mssql.log
          grep -q "^test sqlserver_conforms" mssql.log

  # Oracle Database ships a server image for Linux only (no macOS / Windows
  # runner can host one), so the live suite runs here; the client code it
  # exercises is the same on every OS (above: it builds and its unit tests pass
  # there, and its sockets are rt-net's, proven by the MySQL jobs).
  oracle:
    name: oracle live (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start Oracle Database Free
        shell: bash
        run: |
          docker run -d --name kw-oracle -p 1521:1521 -e ORACLE_PASSWORD=oracle_pw \
            -e APP_USER=kernway -e APP_USER_PASSWORD=kernway_pw gvenzl/oracle-free:23-slim
          for _ in $(seq 1 90); do
            docker exec kw-oracle /opt/oracle/healthcheck.sh >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec kw-oracle /opt/oracle/healthcheck.sh

      - name: "Oracle driver — whole suite, live (TCPS needs a wallet: verified by acceptance/run.sh)"
        shell: bash
        env:
          KERNWAY_ORACLE_HOST: 127.0.0.1
        run: |
          cargo test -p kernway-orm-oracle -- --test-threads=1 --nocapture --skip tcps_ 2>&1 | tee oracle.log
          grep -q "^test result: FAILED" oracle.log && exit 1
          # Every live test must have run: a skip is a failure here.
          if grep -E "^\s*skip\b" oracle.log; then echo "a live test skipped"; exit 1; fi
