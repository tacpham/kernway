# Database drivers on every OS. kernway's drivers must build and work on
# Linux, macOS and Windows, fully async on kernway's own reactor — so each OS
# runs the runtime, the shared SQL layer and the MySQL driver's whole test
# suite against a real MySQL 8.0 of its own, over TCP, TLS and the OS's local
# channel (Unix socket file / Windows named pipe). The acceptance report
# (acceptance/run.sh) takes each job's result as evidence.
name: drivers

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  drivers:
    name: drivers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux: the official image, its socket directory shared with the runner.
      - name: Start MySQL container (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/mysqld && chmod 777 /tmp/mysqld
          docker run -d --name kw-mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=secret \
            -v /tmp/mysqld:/var/run/mysqld mysql:8.0
          # Wait for the final server: the image's first-run init uses a
          # temporary one (no network, no root password yet).
          for _ in $(seq 1 90); do
            docker exec kw-mysql mysql -uroot -psecret -h127.0.0.1 --protocol=TCP -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          echo "MYSQL_CONTAINER=kw-mysql" >> "$GITHUB_ENV"

      - name: Prepare MySQL
        shell: bash
        run: .github/scripts/mysql-ci.sh

      - name: Runtime, shared SQL layer, MySQL driver — all tests, live
        shell: bash
        run: >
          cargo test -p rt-core -p rt-net -p kernway-wire -p kernway-orm-sql -p kernway-orm-mysql
          --features kernway-orm-mysql/mysql -- --test-threads=1

      - name: The local-channel tests ran (not skipped)
        shell: bash
        run: >
          cargo test -p kernway-orm-mysql --features mysql --test connection local_socket_ -- --test-threads=1 --nocapture 2>&1
          | tee local.log; ! grep -qi "skip:" local.log; grep -q "3 passed" local.log

      - name: Oracle driver — builds; unit and protocol tests on this OS
        shell: bash
        run: cargo test -p kernway-orm-oracle --lib --test no_blocking -- --test-threads=1

  # The Redis client on every OS against real servers. Linux and macOS run the
  # whole suite — single node (TCP + Unix socket), TLS with mutual TLS,
  # Sentinel with a real failover, Cluster with a live slot migration and a
  # failover — from local redis-server processes. Windows has no official
  # Redis: Memurai (the Redis-compatible server for Windows) serves the
  # connection and command suites over TCP.
  redis:
    name: redis (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Redis servers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq redis-server redis-sentinel >/dev/null
          sudo systemctl stop redis-server redis-sentinel 2>/dev/null || true
          redis-server --version
          .github/scripts/redis-local.sh "$RUNNER_TEMP/redis"

      - name: Redis servers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install redis >/dev/null
          redis-server --version
          .github/scripts/redis-local.sh "$RUNNER_TEMP/redis"

      - name: Memurai (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install memurai-developer -y --no-progress >/dev/null
          for _ in $(seq 1 30); do
            "/c/Program Files/Memurai/memurai-cli.exe" PING 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          "/c/Program Files/Memurai/memurai-cli.exe" INFO server | grep -i version
          "/c/Program Files/Memurai/memurai-cli.exe" ACL SETUSER kernway on '>kernway_pw' '~*' '&*' '+@all'
          for v in "KERNWAY_REDIS_URL=redis://127.0.0.1:6379" "KW_REDIS_ADDR=127.0.0.1:6379" "KERNWAY_REDIS_ADDR=127.0.0.1:6379" \
                   "KERNWAY_REDIS_USER=kernway" "KERNWAY_REDIS_PASS=kernway_pw"; do
            echo "$v" >> "$GITHUB_ENV"
          done

      - name: Redis client — all tests, live
        shell: bash
        run: cargo test -p kernway-redis -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee redis.log

      - name: Nothing was skipped
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # TLS, Sentinel and Cluster run on Linux and macOS; here the
            # connection and command suites must have run, none skipped.
            cargo test -p kernway-redis --test connection --test commands -- --test-threads=1 --nocapture 2>&1 | tee win.log
            ! grep -q "skip:" win.log
            grep -q "test result: ok. 12 passed" win.log  # connection (the Unix-socket test is not built here)
            grep -q "test result: ok. 8 passed" win.log
          else
            ! grep -q "skip:" redis.log
          fi

  # The PostgreSQL driver on every OS against a real server with every
  # authentication method and TLS (tests/support/pg-setup.sh): Linux runs
  # PostgreSQL 18 in Docker (its socket directory shared with the runner),
  # then again on 14, the oldest supported release; macOS a native Homebrew
  # server (TCP + Unix socket); Windows the runner's own PostgreSQL (TCP).
  postgres:
    name: postgres (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: PostgreSQL 18 (Linux, Docker)
        if: runner.os == 'Linux'
        shell: bash
        run: PG_SOCKET_DIR=/tmp/kwpg-sock crates/kernway-orm-postgres/tests/support/pg-setup.sh "$RUNNER_TEMP/pg" >> "$GITHUB_ENV"

      - name: PostgreSQL (macOS, Homebrew)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install postgresql@17 >/dev/null
          PG_BIN="$(brew --prefix postgresql@17)/bin" crates/kernway-orm-postgres/tests/support/pg-setup.sh "$RUNNER_TEMP/pg" >> "$GITHUB_ENV"

      - name: PostgreSQL (Windows, preinstalled)
        if: runner.os == 'Windows'
        shell: bash
        run: PG_BIN="$(cygpath -u "$PGBIN")" crates/kernway-orm-postgres/tests/support/pg-setup.sh "$RUNNER_TEMP/pg" >> "$GITHUB_ENV"

      - name: PostgreSQL driver — all tests, live
        shell: bash
        run: cargo test -p kernway-orm-postgres --features postgres -- --test-threads=1 --nocapture 2>&1 | tee pg.log; test "${PIPESTATUS[0]}" = 0

      - name: Nothing was skipped
        shell: bash
        run: |
          ! grep -q "skip:" pg.log
          grep -q "^test postgres_conforms" pg.log

      - name: Again on PostgreSQL 14 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          env="$(PG_IMAGE=postgres:14-alpine PG_PORT=5434 PG_CONTAINER=kernway-postgres-14 \
            crates/kernway-orm-postgres/tests/support/pg-setup.sh "$RUNNER_TEMP/pg14")"
          set -a; eval "$env"; set +a
          unset KERNWAY_PG_SOCKET_DIR
          cargo test -p kernway-orm-postgres --features postgres -- --test-threads=1 --skip unix_domain_socket --nocapture 2>&1 | tee pg14.log
          ! grep -q "skip:" pg14.log

  # The MongoDB driver on every OS against MongoDB 8.0: a standalone with
  # SCRAM users (and its Unix socket), a TLS-only server with X.509 users, a
  # three-member replica set and a sharded cluster with two routers
  # (tests/support/mongo-setup.sh). Linux runs them in Docker; macOS and
  # Windows run the official binaries natively.
  mongodb:
    name: mongodb (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MONGO_VERSION: 8.0.4
      MONGOSH_VERSION: 2.3.8
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: MongoDB (Linux, Docker)
        if: runner.os == 'Linux'
        shell: bash
        run: MONGO_SOCKET_DIR=/tmp/kwmongo-sock crates/kernway-orm-mongodb/tests/support/mongo-setup.sh "$RUNNER_TEMP/mongo" >> "$GITHUB_ENV"

      - name: MongoDB (macOS, official binaries)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL "https://fastdl.mongodb.org/osx/mongodb-macos-arm64-$MONGO_VERSION.tgz" | tar xz
          curl -fsSL -o mongosh.zip "https://downloads.mongodb.com/compass/mongosh-$MONGOSH_VERSION-darwin-arm64.zip" && unzip -q mongosh.zip
          cd "$GITHUB_WORKSPACE"
          MONGO_BIN="$RUNNER_TEMP/mongodb-macos-aarch64-$MONGO_VERSION/bin" MONGOSH="$RUNNER_TEMP/mongosh-$MONGOSH_VERSION-darwin-arm64/bin/mongosh" \
            crates/kernway-orm-mongodb/tests/support/mongo-setup.sh "$RUNNER_TEMP/mongo" >> "$GITHUB_ENV"

      - name: MongoDB (Windows, official binaries)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSL -o "$T/mongodb.zip" "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$MONGO_VERSION.zip" && unzip -q "$T/mongodb.zip" -d "$T"
          curl -fsSL -o "$T/mongosh.zip" "https://downloads.mongodb.com/compass/mongosh-$MONGOSH_VERSION-win32-x64.zip" && unzip -q "$T/mongosh.zip" -d "$T"
          MONGO_BIN="$(ls -d "$T"/mongodb-win32-x86_64-*/bin | head -1)" MONGOSH="$T/mongosh-$MONGOSH_VERSION-win32-x64/bin/mongosh.exe" \
            crates/kernway-orm-mongodb/tests/support/mongo-setup.sh "$T/mongo" >> "$GITHUB_ENV"

      - name: MongoDB driver — all tests, live
        shell: bash
        run: cargo test -p kernway-orm-mongodb -- --test-threads=1 --nocapture 2>&1 | tee mongo.log

      - name: Nothing was skipped
        shell: bash
        run: |
          ! grep -q "skip:" mongo.log
          grep -q "^test transactions_and_no_lost_update" mongo.log

  # Oracle Database ships a server image for Linux only (no macOS / Windows
  # runner can host one), so the live suite runs here; the client code it
  # exercises is the same on every OS (above: it builds and its unit tests pass
  # there, and its sockets are rt-net's, proven by the MySQL jobs).
  oracle:
    name: oracle live (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start Oracle Database Free
        shell: bash
        run: |
          docker run -d --name kw-oracle -p 1521:1521 -e ORACLE_PASSWORD=oracle_pw \
            -e APP_USER=kernway -e APP_USER_PASSWORD=kernway_pw gvenzl/oracle-free:23-slim
          for _ in $(seq 1 90); do
            docker exec kw-oracle /opt/oracle/healthcheck.sh >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec kw-oracle /opt/oracle/healthcheck.sh

      - name: "Oracle driver — whole suite, live (TCPS needs a wallet: verified by acceptance/run.sh)"
        shell: bash
        env:
          KERNWAY_ORACLE_HOST: 127.0.0.1
        run: |
          cargo test -p kernway-orm-oracle -- --test-threads=1 --nocapture --skip tcps_ 2>&1 | tee oracle.log
          grep -q "^test result: FAILED" oracle.log && exit 1
          # Every live test must have run: a skip is a failure here.
          if grep -E "^\s*skip\b" oracle.log; then echo "a live test skipped"; exit 1; fi
