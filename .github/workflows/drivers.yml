# Database drivers on every OS. kernway's drivers must build and work on
# Linux, macOS and Windows, fully async on kernway's own reactor — so each OS
# runs the runtime, the shared SQL layer and the MySQL driver's whole test
# suite against a real MySQL 8.0 of its own, over TCP, TLS and the OS's local
# channel (Unix socket file / Windows named pipe). The acceptance report
# (acceptance/run.sh) takes each job's result as evidence.
name: drivers

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  drivers:
    name: drivers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux: the official image, its socket directory shared with the runner.
      - name: Start MySQL container (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p /tmp/mysqld && chmod 777 /tmp/mysqld
          docker run -d --name kw-mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=secret \
            -v /tmp/mysqld:/var/run/mysqld mysql:8.0
          # Wait for the final server: the image's first-run init uses a
          # temporary one (no network, no root password yet).
          for _ in $(seq 1 90); do
            docker exec kw-mysql mysql -uroot -psecret -h127.0.0.1 --protocol=TCP -e 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          echo "MYSQL_CONTAINER=kw-mysql" >> "$GITHUB_ENV"

      - name: Prepare MySQL
        shell: bash
        run: .github/scripts/mysql-ci.sh

      - name: Runtime, shared SQL layer, MySQL driver — all tests, live
        shell: bash
        run: >
          cargo test -p rt-core -p rt-net -p kernway-wire -p kernway-orm-sql -p kernway-orm-mysql
          --features kernway-orm-mysql/mysql -- --test-threads=1

      - name: The local-channel tests ran (not skipped)
        shell: bash
        run: >
          cargo test -p kernway-orm-mysql --features mysql --test connection local_socket_ -- --test-threads=1 --nocapture 2>&1
          | tee local.log; ! grep -qi "skip:" local.log; grep -q "3 passed" local.log

      - name: Oracle driver — builds; unit and protocol tests on this OS
        shell: bash
        run: cargo test -p kernway-orm-oracle --lib --test no_blocking -- --test-threads=1

  # Oracle Database ships a server image for Linux only (no macOS / Windows
  # runner can host one), so the live suite runs here; the client code it
  # exercises is the same on every OS (above: it builds and its unit tests pass
  # there, and its sockets are rt-net's, proven by the MySQL jobs).
  oracle:
    name: oracle live (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start Oracle Database Free
        shell: bash
        run: |
          docker run -d --name kw-oracle -p 1521:1521 -e ORACLE_PASSWORD=oracle_pw \
            -e APP_USER=kernway -e APP_USER_PASSWORD=kernway_pw gvenzl/oracle-free:23-slim
          for _ in $(seq 1 90); do
            docker exec kw-oracle /opt/oracle/healthcheck.sh >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec kw-oracle /opt/oracle/healthcheck.sh

      - name: Oracle driver — whole suite, live (TCPS needs a wallet: verified by acceptance/run.sh)
        shell: bash
        env:
          KERNWAY_ORACLE_HOST: 127.0.0.1
        run: |
          cargo test -p kernway-orm-oracle -- --test-threads=1 --nocapture --skip tcps_ 2>&1 | tee oracle.log
          grep -q "^test result: FAILED" oracle.log && exit 1
          # Every live test must have run: a skip is a failure here.
          if grep -E "^\s*skip\b" oracle.log; then echo "a live test skipped"; exit 1; fi
