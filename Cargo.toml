[workspace]
members = [
    "crates/kernway-core",
    "crates/rt-core",
    "crates/rt-net",
    "crates/di-core",
    "crates/di-macro",
    "crates/kernway-http",
    "crates/kernway-web",
    "crates/kernway-htmx",
    "crates/kernleaf",
    "crates/kernway-security",
    "crates/kernway-server",
    "crates/kernway-static",
    "crates/kernway-orm-core",
    "crates/kernway-orm-macro",
    "crates/kernway-orm-memory",
    "crates/kernway-orm-sqlite",
    "crates/kernway-cache-core",
    "crates/kernway-cache-macro",
    "crates/kernway-cache-memory",
    "crates/kernway-redis",
    "crates/kernway-openapi",
    "crates/kernway-sse",
    "crates/kernway-multipart",
    "crates/kernway",
    "examples/echo-server",
    "examples/hello-di",
    "examples/hello-di-v2",
    "examples/hello-di-v3",
    "examples/hello-web",
    "examples/todo-orm",
    "examples/hello-cache",
    "examples/hello-openapi",
    "examples/todo-app",
    "examples/todo-sqlite",
    "examples/web-docker",
    "examples/login-htmx",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["Kernway Contributors"]
license      = "MIT"
repository   = "https://github.com/kernway/kernway"
homepage     = "https://kernway.dev"
# MSRV — enforced by the `msrv` CI job. Bumping this is a deliberate,
# documented decision (see docs/VERSIONING.md), not incidental.
rust-version = "1.78"

# Documentation is part of the API, so it is linted like the API.
# `missing_docs` keeps every public item explained; the rustdoc lints keep the
# links between them from rotting. Warn, not deny: a work-in-progress branch
# should not fail to build over a missing sentence — CI is where this bites.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
invalid_html_tags = "warn"

[workspace.dependencies]
# Proc-macro
syn         = { version = "2", features = ["full", "extra-traits", "derive"] }
quote       = "1"
proc-macro2 = "1"

# Error handling
thiserror = "1"
anyhow    = "1"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Benchmarking — statistical micro-benchmarks with regression detection
# against a saved baseline (see scripts/check-core.sh --with-bench).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Async
futures-core = "0.3"

# Runtime — I/O readiness (epoll/kqueue/IOCP) and the platform layer.
# `mio` is the only third-party primitive rt-core builds on; everything above it
# (Task, Waker, Executor, Reactor) is hand-written — see docs/design/modules/rt-core.md.
mio  = { version = "1", features = ["os-poll", "net"] }
libc = "0.2"

# Internal crates
kernway-core         = { path = "crates/kernway-core" }
kernway-http         = { path = "crates/kernway-http" }
kernway-web          = { path = "crates/kernway-web" }
kernway-htmx         = { path = "crates/kernway-htmx" }
kernleaf             = { path = "crates/kernleaf" }
kernway-security     = { path = "crates/kernway-security" }
kernway-server       = { path = "crates/kernway-server" }
kernway-static       = { path = "crates/kernway-static" }
kernway-orm-core     = { path = "crates/kernway-orm-core" }
kernway-orm-macro    = { path = "crates/kernway-orm-macro" }
kernway-orm-memory   = { path = "crates/kernway-orm-memory" }
kernway-orm-sqlite   = { path = "crates/kernway-orm-sqlite" }
kernway-cache-core   = { path = "crates/kernway-cache-core" }
kernway-cache-macro  = { path = "crates/kernway-cache-macro" }
kernway-cache-memory = { path = "crates/kernway-cache-memory" }
kernway-openapi      = { path = "crates/kernway-openapi" }
kernway-sse          = { path = "crates/kernway-sse" }
kernway-multipart    = { path = "crates/kernway-multipart" }
rt-core              = { path = "crates/rt-core" }
rt-net               = { path = "crates/rt-net" }
di-core              = { path = "crates/di-core" }
di-macro             = { path = "crates/di-macro" }

[profile.release]
opt-level = 3
lto       = "thin"
strip     = true
